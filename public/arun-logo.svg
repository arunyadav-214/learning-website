<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 590" role="img" aria-labelledby="title desc">
<title id="title">Arun mountain logo</title>
<desc id="desc">Gold circular mountain emblem with a stylized black A and the word ARUN.</desc>
<defs>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#8f5b16"/>
    <stop offset="0.45" stop-color="#d6a64d"/>
    <stop offset="0.72" stop-color="#f0c96d"/>
    <stop offset="1" stop-color="#8a5413"/>
  </linearGradient>
  <linearGradient id="sun" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#f4cd72"/>
    <stop offset="1" stop-color="#c98a2e"/>
  </linearGradient>
</defs>
<rect width="520" height="590" fill="#f7f4ec"/>
<circle cx="260" cy="248" r="205" fill="none" stroke="url(#gold)" stroke-width="9"/>

<!-- sun -->
<circle cx="362" cy="178" r="49" fill="url(#sun)"/>

